<!doctype html>

<title>생활권 중심지 유입 흐름</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: 왼쪽 조작 · 가운데 흐름 지도 · 오른쪽 상대 생활권 표. 좁으면 지도 → 조작 → 표 */
:root {
  --bg: #f2f4f6; --panel: #ffffff; --fg: #17212b; --muted: #5a6672; --line: #cfd6dd; --row: #eef2f5;
  --sea: #d9e3ea; --land: #f7f6f2; --sido: #9aa6b1; --sgg: #d3d9de; --other: #9aa3ab;
  --kt: #1d5fc4; --kcb: #c25e10; --cmp: #17212b;
  --font: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0e1318; --panel: #151c24; --fg: #e5ebf1; --muted: #93a0ad; --line: #2b3744; --row: #1c2630;
  --sea: #0b1116; --land: #19212a; --sido: #4d5b69; --sgg: #26313c; --other: #66717c;
  --kt: #6ea6ff; --kcb: #f0a35a; --cmp: #e5ebf1; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0e1318; --panel: #151c24; --fg: #e5ebf1; --muted: #93a0ad; --line: #2b3744; --row: #1c2630;
  --sea: #0b1116; --land: #19212a; --sido: #4d5b69; --sgg: #26313c; --other: #66717c;
  --kt: #6ea6ff; --kcb: #f0a35a; --cmp: #e5ebf1; color-scheme: dark }
html, body { height: 100%; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 14px; }
.app { display: grid; grid-template-columns: 280px 1fr 360px; grid-template-rows: minmax(0, 1fr); grid-template-areas: "side map table"; height: 100%; }
.app > * { min-height: 0; min-width: 0; }
aside { grid-area: side; background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 14px;
  padding-block: 16px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: 16px; overflow-y: auto; }
#map { grid-area: map; position: relative; background: var(--sea); overflow: hidden; }
.tpanel { grid-area: table; background: var(--panel); border-left: 1px solid var(--line); display: flex; flex-direction: column;
  padding-block: 16px 0; padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-left: 16px; }
h1 { font-size: 16px; font-weight: 700; margin: 0; letter-spacing: -0.01em; }
h2 { font-size: 18px; font-weight: 700; margin: 0; text-wrap: balance; }
.sub { color: var(--muted); font-size: 12px; margin: 2px 0 0; }
.label { font-size: 11px; font-weight: 600; letter-spacing: 0.06em; color: var(--muted); margin: 0 0 6px; display: block; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 8px; }
.stat b { display: block; font: 500 15px var(--mono); font-variant-numeric: tabular-nums; }
.stat span { font-size: 11px; color: var(--muted); }
.seg { display: grid; grid-auto-columns: 1fr; grid-auto-flow: column; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seg button { font: inherit; border: 0; background: transparent; color: var(--fg); padding: 7px 4px; cursor: pointer; line-height: 1.3; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button small { display: block; color: var(--muted); font-size: 11px; }
.seg button[aria-pressed="true"] { background: var(--ds); color: var(--panel); font-weight: 600; }
.seg button[aria-pressed="true"] small { color: inherit; opacity: 0.85; }
.seg button:disabled { color: var(--muted); cursor: not-allowed; }
.seg.sm button { padding: 5px 4px; font-size: 12px; }
.seg.kind { grid-auto-flow: row; grid-template-columns: 1fr 1fr; }
.seg.kind button:nth-child(3) { border-left: 0; }
.seg.kind button:nth-child(n+3) { border-top: 1px solid var(--line); }
:root[data-mode="int"] .ext-only, :root:not([data-mode="int"]) .int-only { display: none; } /* 내부 모드 전용·외부 전용 조작 */
button:focus-visible, input:focus-visible, select:focus-visible, li:focus-visible, tr:focus-visible { outline: 2px solid var(--ds); outline-offset: 2px; }
select, input[type=number], input[type=search] { font: 13px var(--font); width: 100%; box-sizing: border-box; padding: 5px 7px; border: 1px solid var(--line); border-radius: 4px; background: var(--bg); color: var(--fg); }
input[type=number] { font-family: var(--mono); }
#ktu { margin-top: 8px; }
.thr { display: grid; grid-template-columns: 1fr 84px; gap: 8px; align-items: center; }
.thr input[type=range] { width: 100%; accent-color: var(--ds); }
.opts { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center; font-size: 12px; color: var(--muted); }
.chk { grid-column: 1 / -1; display: flex; gap: 6px; align-items: center; font-size: 13px; color: var(--fg); cursor: pointer; }
.chk input { accent-color: var(--ds); margin: 0; }
.list { display: flex; flex-direction: column; flex: 1; min-height: 160px; }
.list ul { list-style: none; margin: 6px 0 0; padding: 0; overflow-y: auto; flex: 1; border-top: 1px solid var(--line); }
.list li { display: flex; justify-content: space-between; gap: 8px; padding: 6px 4px; border-bottom: 1px solid var(--line); cursor: pointer; font-size: 13px; }
.list li em { font: normal 12px var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.list li[aria-selected="true"] { font-weight: 600; box-shadow: inset 3px 0 0 var(--ds); }
.list li:hover { background: var(--row); }
.twrap { overflow: auto; flex: 1; margin-top: 10px; border-top: 1px solid var(--line); }
table { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
th { position: sticky; top: 0; background: var(--panel); text-align: left; font-size: 11px; font-weight: 600; color: var(--muted); padding: 7px 6px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 6px; border-bottom: 1px solid var(--line); }
.num { text-align: right; font-family: var(--mono); font-size: 12px; white-space: nowrap; }
tbody tr { cursor: pointer; }
tbody tr:hover, tbody tr.hot { background: var(--row); }
tbody tr.focus { box-shadow: inset 3px 0 0 var(--fg); font-weight: 600; }
tbody tr.below td { color: var(--muted); }
tbody tr.sep td { font-size: 11px; font-weight: 600; color: var(--muted); background: var(--bg); cursor: default; padding-block: 5px; }
.sw { display: inline-block; width: 11px; height: 11px; border-radius: 3px; vertical-align: -1px; }
.share { position: relative; }
.share i { position: absolute; right: 6px; bottom: 2px; height: 3px; border-radius: 2px 0 0 2px; background: var(--muted); opacity: 0.45; }
tfoot td { position: sticky; bottom: 0; background: var(--panel); font-weight: 600; border-top: 1px solid var(--line); border-bottom: 0; padding-block: 8px; }
.legend, .chips, .empty { z-index: 2; } /* deck 캔버스 위로 */
.legend { position: absolute; right: 12px; bottom: 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; font-size: 12px; display: grid; gap: 5px; }
.legend div { display: flex; align-items: center; gap: 8px; }
.legend small { color: var(--muted); font-size: 10px; }
.lsw { width: 22px; height: 10px; border-radius: 2px; flex: none; }
.chips { position: absolute; left: 12px; top: 12px; display: flex; flex-direction: column; align-items: flex-start; gap: 6px; max-width: calc(100% - 24px); }
.chip { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; font-size: 13px; display: flex; gap: 10px; align-items: center; }
.chip button { font: inherit; font-size: 12px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); border-radius: 4px; padding: 2px 8px; cursor: pointer; }
.empty { position: absolute; left: 50%; top: 16px; transform: translateX(-50%); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 7px 12px; font-size: 13px; }
.tip { font-family: var(--font) !important; font-size: 12px !important; line-height: 1.55; background: var(--panel) !important; color: var(--fg) !important; border: 1px solid var(--line); border-radius: 4px; }
@media (max-width: 1200px) {
  .app { grid-template-columns: 280px 1fr; grid-template-rows: minmax(0, 1fr) minmax(0, 40%); grid-template-areas: "side map" "side table"; }
  .tpanel { border-left: 0; border-top: 1px solid var(--line); padding-top: 12px; }
}
@media (max-width: 760px) {
  .app { grid-template-columns: minmax(0, 1fr); grid-template-rows: 60vh auto auto; grid-template-areas: "map" "side" "table"; height: auto; }
  aside { border-right: 0; padding-right: max(16px, env(safe-area-inset-right, 0px)); overflow: visible; }
  .list ul { max-height: 260px; }
  .tpanel { padding-left: max(16px, env(safe-area-inset-left, 0px)); }
  .twrap { max-height: 70vh; }
  .legend { display: none; }
}
</style>

<div id="gate"><form id="gate-f">
  <div><h1>생활권 중심지 유입 흐름</h1><p class="sub">연구진 전용 · 받은 비밀번호를 입력하세요</p></div>
  <input id="gate-pw" type="password" autocomplete="current-password" aria-label="비밀번호" required>
  <button id="gate-b">열기</button>
  <p class="err" id="gate-err" hidden>비밀번호가 맞지 않습니다</p>
</form></div>
<script>
// 데이터: data/<키>.bin = IV(12) + AES-GCM(gzip(JSON)). 키 = PBKDF2-SHA256(비밀번호, salt)
(() => {
  const S = window.__site, b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
  let ready; const keyP = new Promise((r) => (ready = r));
  const derive = async (pw) => crypto.subtle.deriveKey(
    { name: "PBKDF2", salt: b64(S.salt), iterations: S.iter, hash: "SHA-256" },
    await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]),
    { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  const open = async (key, buf) => {
    const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: buf.slice(0, 12) }, key, buf.slice(12));
    return new Response(new Blob([plain]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
  };
  const tryPw = async (pw) => { const key = await derive(pw); await open(key, b64(S.check).buffer); return key; };
  window.__load = async (k) => {
    const key = await keyP, r = await fetch(`data/${k}.bin?v=${encodeURIComponent(S.salt)}`); // 게시마다 salt 가 바뀌어 옛 캐시를 안 씀
    if (!r.ok) throw new Error(`data/${k}.bin 를 읽지 못했습니다 (${r.status})`);
    return JSON.parse(await open(key, await r.arrayBuffer()));
  };
  const done = (key, pw) => { try { sessionStorage.setItem("cif-pw", pw); } catch {} document.getElementById("gate").remove(); ready(key); };
  document.getElementById("gate-f").addEventListener("submit", async (e) => {
    e.preventDefault();
    const pw = document.getElementById("gate-pw").value, b = document.getElementById("gate-b");
    b.disabled = true; b.textContent = "확인 중…";
    try { done(await tryPw(pw), pw); }
    catch { document.getElementById("gate-err").hidden = false; b.disabled = false; b.textContent = "열기"; }
  });
  try { const pw = sessionStorage.getItem("cif-pw"); if (pw) tryPw(pw).then((k) => done(k, pw), () => {}); } catch {}
})();
</script>

const DEFAULT_THR = { kt: 5, kcb: 100, cmp: 1, ikt: 0.5, ikcb: 5, icmp: 0.1 };
const KINDS = { pc: "주변부 → 중심지", cp: "중심지 → 주변부", ccx: "중심지 ↔ 중심지 (덩어리 사이)", ccs: "같은 덩어리 안", pp: "주변부 ↔ 주변부" };
// 범주 8색 (dataviz 기본 팔레트, 라이트/다크 각각 검증된 단계)
const CAT = {
  light: ["#2a78d6", "#eb6834", "#1baf7a", "#eda100", "#e87ba4", "#008300", "#6250d6", "#e34948"],
  dark: ["#3987e5", "#d95926", "#199e70", "#c98500", "#d55181", "#008300", "#9085e9", "#e66767"],
};
const ESRI = "https://server.arcgisonline.com/ArcGIS/rest/services/Canvas";
const TILES = { light: "World_Light_Gray_Base", dark: "World_Dark_Gray_Base" };
const ARROW = "data:image/svg+xml;utf8," + encodeURIComponent("<svg xmlns='http://www.w3.org/2000/svg' width='64' height='64'><path d='M2 6 L64 32 L2 58 L14 32 Z' fill='#fff'/></svg>");
const state = { ds: "kt", dir: "in", ot: "all", kind: "pc", part: null, rid: null, thr: { ...DEFAULT_THR }, flows: {}, hoverO: null, focusO: null,
  anim: !matchMedia("(prefers-reduced-motion: reduce)").matches, bm: "vec", tilesOK: false, zoom: 6.2, t: 0, ktu: "hour", dmode: "part" };
const fac = (ds = state.ds) => (ds === "kt" ? KTU[state.ktu].f : 1);
const unit = () => (state.ds === "cmp" ? "%" : state.ds === "kt" ? KTU[state.ktu].unit : "명");
const cmp = () => state.ds === "cmp";
const inner = () => state.dir === "int";
const tk = () => (inner() ? "i" : "") + state.ds; // 임계치 키
let regions, centers, summary, labels, G, vec, deckgl, rname = [], RID = [], statById = {}, ridIdx = {}, regionBy = {};
let D = { list: [], shown: [], trips: [], dots: [], dotsShown: [], byO: new Map(), max: 1, total: 0 };

const $ = (id) => document.getElementById(id);
const fmt = (v) => v >= 100 ? Math.round(v).toLocaleString() : v >= 10 ? v.toFixed(1) : v.toFixed(2);
const pct = (v) => `${(100 * v).toFixed(1)}%`;
const css = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const rgb = (hex, a = 255) => { const n = parseInt(hex.slice(1), 16); return [n >> 16, (n >> 8) & 255, n & 255, a]; };
const A = (c, a) => [c[0], c[1], c[2], a];
const mix = (a, b, t) => [0, 1, 2].map((i) => Math.round(a[i] + (b[i] - a[i]) * t)).concat(255);
const isDark = () => { const t = document.documentElement.dataset.theme; return t ? t === "dark" : matchMedia("(prefers-color-scheme: dark)").matches; };
const ro = (name) => `${name}${{ in: "으로 오는 곳", out: "에서 가는 곳", int: " 안 통근" }[state.dir]}`; // 생활권명은 모두 '권'으로 끝남
const partNo = (p) => state.partOf[p].no;
const partColor = (p) => { const n = partNo(p); return rgb(n <= 8 ? CAT[D.theme][n - 1] : css("--other")); };

// 데이터는 data/<키>.js 가 __d(키, 데이터) 를 부르는 형태 — fetch 가 막히는 file:// 에서도 열리게 <script> 로 읽는다.
// 단일 파일 버전은 데이터가 미리 window.__store 에, 비밀번호 사이트(publish.py)는 window.__load 가 복호화해 준다
const waiting = {}, store = window.__store || {};
window.__d = (k, v) => { if (waiting[k]) { waiting[k](v); delete waiting[k]; } else store[k] = v; };
const load = (k) => window.__load ? window.__load(k) : k in store ? Promise.resolve(store[k]) : new Promise((res, rej) => {
  waiting[k] = res;
  const s = document.createElement("script");
  s.src = `data/${k}.js`;
  s.onerror = () => rej(new Error(`data/${k}.js 를 읽지 못했습니다`));
  s.onload = () => s.remove();
  document.head.appendChild(s);
});

function probeTiles() {
  return new Promise((res) => {
    const img = new Image(), to = setTimeout(() => res(false), 4000);
    img.onload = () => { clearTimeout(to); res(true); };
    img.onerror = () => { clearTimeout(to); res(false); };
    img.crossOrigin = "anonymous";
    img.src = `${ESRI}/World_Light_Gray_Base/MapServer/tile/7/50/109`;
  });
}

// 행정경계 배경은 타일을 못 쓸 때만 받는다 (2.7MB)
async function ensureVec() {
  if (!vec) vec = Object.fromEntries(await Promise.all(["sido", "sgg"].map(async (k) => [k, await load(k)])));
}

async function init() {
  const tiles = probeTiles();
  [regions, centers, summary, labels, G] = await Promise.all(["regions", "centers", "summary", "labels", "grids"].map(load));
  rname = summary.regions.map((r) => r.rname);
  RID = summary.regions.map((r) => r.rid);
  RID.forEach((r, i) => (ridIdx[r] = i));
  summary.stats.forEach((s) => (statById[s.rid] = s));
  regions.features.forEach((f) => (regionBy[f.properties.rid] = f));
  const byRid = {};
  centers.features.forEach((f) => (byRid[f.properties.rid] ??= []).push(f));
  // 덩어리 번호: 생활권 안에서 격자 수 큰 순 1, 2, … (내부 모드 색·이름표)
  Object.values(byRid).forEach((fs) => fs.sort((a, b) => b.properties.n_grid - a.properties.n_grid).forEach((f, i) => (f.properties.no = i + 1)));
  state.centersBy = byRid;
  state.partOf = Object.fromEntries(centers.features.map((f) => [f.properties.part, f.properties]));

  state.tilesOK = await tiles;
  state.bm = state.tilesOK ? "tile" : "vec";
  if (state.bm === "vec") await ensureVec();
  await document.fonts.ready;
  deckgl = new deck.Deck({
    parent: $("map"),
    initialViewState: { longitude: 127.8, latitude: 36.1, zoom: 6.2 },
    controller: true,
    getTooltip,
    onViewStateChange: ({ viewState }) => {
      const crossed = (viewState.zoom >= 8.3) !== (state.zoom >= 8.3);
      state.zoom = viewState.zoom;
      if (crossed && !state.anim) draw();
    },
    onClick: (info) => {
      const id = info.layer?.id;
      if (id === "arrows" || id === "heads") toggleFocus(info.object.o);
      else if (id === "centers") togglePart(info.object.properties.part);
      else if (id === "regions") select(info.object.properties.rid);
    },
  });
  wire();
  syncControls();
  renderList();
  const sp = RID.find((r) => location.hash === `#r${r.slice(-3)}`);
  if (sp) await select(sp); else { rebuild(); draw(); }
  new MutationObserver(() => { rebuild(); draw(); }).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { rebuild(); draw(); });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && state.focusO != null) toggleFocus(state.focusO); });
  requestAnimationFrame(loop);
}

function loop(ts) {
  if (state.anim && !document.hidden && state.rid) { state.t = (ts / 2600) % 1; draw(); }
  requestAnimationFrame(loop);
}

// 데이터·방향·출발지 등 '무엇을 묶나'가 바뀔 때
function reset({ fit = false } = {}) {
  state.focusO = null; state.hoverO = null;
  syncControls(); renderList(); rebuild();
  if (fit && state.rid) fitTo(state.rid);
  draw();
}

function wire() {
  const on = (attr, fn) => document.querySelectorAll(`[data-${attr}]`).forEach((b) => b.addEventListener("click", () => fn(b.dataset[attr])));
  on("ds", (v) => { state.ds = v; reset(); });
  on("dir", (v) => { state.dir = v; state.part = null; reset({ fit: true }); });
  on("ot", (v) => { state.ot = v; reset(); });
  on("kind", (v) => { state.kind = v; reset(); });
  on("dm", (v) => { state.dmode = v; reset(); });
  on("bm", async (v) => { state.bm = v; if (v === "vec") await ensureVec(); syncControls(); draw(); });
  $("ktu").addEventListener("change", (e) => {
    const old = KTU[state.ktu].f;
    state.ktu = e.target.value;
    for (const k of ["kt", "ikt"]) state.thr[k] = +(state.thr[k] * KTU[state.ktu].f / old).toPrecision(3); // 같은 화살표가 남도록 임계치도 같은 배수로
    reset();
  });
  $("thr-range").addEventListener("input", (e) => { state.thr[tk()] = fromSlider(+e.target.value); syncControls(false); applyThreshold(); draw(); });
  $("thr-num").addEventListener("change", (e) => { state.thr[tk()] = Math.max(0, +e.target.value || 0); syncControls(); applyThreshold(); draw(); });
  $("anim").addEventListener("change", (e) => { state.anim = e.target.checked; draw(); });
  $("q").addEventListener("input", renderList);
  $("chip-x").addEventListener("click", () => toggleFocus(state.focusO));
  $("chip-part-x").addEventListener("click", () => togglePart(state.part));
  const tb = $("tbody");
  // 표 행: data-o = 강조할 흐름, data-kind = 내부 흐름 종류 바꾸기, data-part = 덩어리 하나만
  const act = (tr) => tr.dataset.kind ? (state.kind = tr.dataset.kind, reset()) : tr.dataset.part ? togglePart(+tr.dataset.part) : toggleFocus(+tr.dataset.o);
  tb.addEventListener("click", (e) => { const tr = e.target.closest("tr[tabindex]"); if (tr) act(tr); });
  tb.addEventListener("keydown", (e) => { const tr = e.target.closest("tr[tabindex]"); if (tr && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); act(tr); } });
  tb.addEventListener("mouseover", (e) => { const tr = e.target.closest("tr[data-o]"); setHover(tr ? +tr.dataset.o : null, false); });
  tb.addEventListener("mouseleave", () => setHover(null, false));
}

// 임계치 슬라이더는 로그 스케일 (0.1 ~ 1,000,000)
const LO = -1, HI = 6;
const fromSlider = (t) => t === 0 ? 0 : +(10 ** (LO + (t / 1000) * (HI - LO))).toPrecision(2);
const toSlider = (v) => v <= 0 ? 0 : Math.round(((Math.log10(v) - LO) / (HI - LO)) * 1000);
function syncControls(updateRange = true) {
  const v = state.thr[tk()];
  if (updateRange) $("thr-range").value = toSlider(v);
  $("thr-num").value = v;
  $("thr-l").textContent = `임계치 · ${cmp() ? "평균 비중 %" : unit()} 이상${inner() && state.kind !== "cc" ? " (1km 격자)" : ""}`;
  document.documentElement.style.setProperty("--ds", `var(--${state.ds})`);
  document.documentElement.dataset.mode = state.dir;
  for (const [attr, key] of [["ds", "ds"], ["dir", "dir"], ["ot", "ot"], ["kind", "kind"], ["dm", "dmode"], ["bm", "bm"]])
    document.querySelectorAll(`[data-${attr}]`).forEach((x) => x.setAttribute("aria-pressed", x.dataset[attr] === state[key]));
  $("bm-tile").disabled = !state.tilesOK;
  $("bm-tile").title = state.tilesOK ? "" : "이 환경에서는 외부 지도 타일을 불러올 수 없습니다";
  $("ktu").hidden = state.ds !== "kt";
  $("ktu").value = state.ktu;
  $("kt-sm").textContent = KTU[state.ktu].unit;
  $("anim").checked = state.anim;
  $("attr").textContent = state.bm === "tile" ? "© Esri, HERE, Garmin, © OpenStreetMap contributors" : "SGIS 행정구역 2025.6";
  const rel = state.dir === "in" ? "출발" : "도착", size = cmp() ? "KT·KCB 평균 비중" : "통근량";
  $("lg-a").textContent = !inner() ? (cmp() ? "굵기 = KT·KCB 평균 비중" : `굵기 = ${state.dir === "in" ? "유입" : "유출"}량 · 색 = ${rel} 생활권`)
    : { pc: `점 = 주변부 출발 격자 · 크기 = ${size}${cmp() ? "" : " · 색 = 주로 가는 중심지"}`,
        cp: `점 = 주변부 도착 격자 · 크기 = ${size}${cmp() ? "" : " · 색 = 주로 오는 중심지"}`,
        cc: `굵기 = 덩어리 사이 ${size}${cmp() ? "" : " · 색 = 출발 중심지"}`,
        pp: `점 = 주변부 격자 · 크기 = 다른 주변부로 가는 ${size}` }[state.kind];
  $("lg-cmp").hidden = !cmp();
  $("lg-cmp-t").textContent = `KCB 비중 큼 · 비슷 · KT 비중 큼 (${inner() ? "상대 차이" : "±5%p"})`;
  $("lg-c").textContent = inner() ? "중심지 (번호 = 큰 순, 눌러서 하나만)" : state.dir === "in" ? "중심지 (눌러서 덩어리만 보기)" : "도착 중심지";
}

function renderList() {
  const q = $("q").value.trim(), k = `${cmp() ? "kt" : state.ds}_${state.dir}`;
  const rows = summary.regions.filter((r) => r.rname.includes(q)).sort((a, b) => statById[b.rid][k] - statById[a.rid][k]);
  $("regions").innerHTML = rows.map((r) =>
    `<li role="option" tabindex="0" data-rid="${r.rid}" aria-selected="${r.rid === state.rid}"><span>${r.rname}</span><em>${cmp() ? "" : fmt(statById[r.rid][k] * fac())}</em></li>`).join("");
  $("regions").querySelectorAll("li").forEach((li) => {
    li.addEventListener("click", () => select(li.dataset.rid));
    li.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); select(li.dataset.rid); } });
  });
}

async function select(rid) {
  if (rid === state.rid) return;
  state.rid = rid; state.focusO = null; state.hoverO = null; state.part = null;
  history.replaceState(null, "", `#r${rid.slice(-3)}`);
  $("regions").querySelectorAll("li").forEach((li) => li.setAttribute("aria-selected", li.dataset.rid === rid));
  if (!state.flows[rid]) state.flows[rid] = await load(`flows/r${rid.slice(-3)}`);
  rebuild();
  fitTo(rid);
  draw();
}

// ── 상대 생활권별 묶음 (유입 = 출발 생활권, 유출 = 도착 생활권) ───────────────
// 행: [출발 격자 idx, 도착 덩어리, 값, 상대 생활권 idx, 출발=중심지 1/0]
function bundle(ds) {
  const f = fac(ds), by = new Map(), part = state.dir === "in" ? state.part : null;
  for (const r of state.flows[state.rid][state.dir][ds]) {
    if ((state.ot === "c" && !r[4]) || (state.ot === "p" && r[4]) || (part != null && r[1] !== part)) continue;
    const v = r[2] * f, g = G[r[0]];
    let b = by.get(r[3]);
    if (!b) by.set(r[3], (b = { o: r[3], v: 0, sx: 0, sy: 0, parts: new Map(), grids: new Map() }));
    b.v += v; b.sx += g[0] * v; b.sy += g[1] * v;
    b.parts.set(r[1], (b.parts.get(r[1]) || 0) + v);
    b.grids.set(r[0], (b.grids.get(r[0]) || 0) + v);
  }
  const list = [...by.values()].sort((a, b) => b.v - a.v), total = list.reduce((a, b) => a + b.v, 0);
  for (const b of list) {
    b.share = b.v / total; b.cx = b.sx / b.v; b.cy = b.sy / b.v;
    b.gridPts = [...b.grids].map(([g, v]) => [G[g][0], G[g][1], v]);
  }
  return { list, total };
}

function nearest(pts, x, y) {
  let best = pts[0], d = Infinity;
  for (const p of pts) { const e = (p[0] - x) ** 2 + (p[1] - y) ** 2; if (e < d) { d = e; best = p; } }
  return [best[0], best[1]];
}

// 2차 베지어 곡선 (진행 방향 오른쪽으로 휨). 화살 끝 = 도착점
function curve(a, b) {
  const k = Math.cos(((a[1] + b[1]) / 2) * Math.PI / 180);
  const ax = a[0] * k, ay = a[1], bx = b[0] * k, by = b[1], dx = bx - ax, dy = by - ay;
  const cx = (ax + bx) / 2 + dy * 0.2, cy = (ay + by) / 2 - dx * 0.2;
  const pts = [];
  for (let i = 0; i <= 40; i++) {
    const t = i / 40, u = 1 - t;
    pts.push([(u * u * ax + 2 * u * t * cx + t * t * bx) / k, u * u * ay + 2 * u * t * cy + t * t * by]);
  }
  return pts;
}
const merc = (lat) => Math.log(Math.tan(Math.PI / 4 + (lat * Math.PI) / 360));
const heading = (p, q) => (Math.atan2(merc(q[1]) - merc(p[1]), ((q[0] - p[0]) * Math.PI) / 180) * 180) / Math.PI;

// 출발점 = 출발 격자 유입량 가중 중심(가장 가까운 격자), 도착점 = 그 묶음을 가장 많이 받는 덩어리 대표점 또는 도착 생활권 중심.
// (가중 중심에 가장 가까운 덩어리로 하면 큰 덩어리들 사이의, 거의 안 받는 작은 덩어리를 가리킬 수 있다)
function place(b) {
  b.src = nearest(b.gridPts, b.cx, b.cy);
  const dest = state.dir === "in" ? state.rid : RID[b.o];
  if (state.dmode === "region") b.dst = [regionBy[dest].properties.cx, regionBy[dest].properties.cy];
  else {
    let top = null, mv = -1;
    for (const [p, v] of b.parts) if (v > mv) { mv = v; top = p; }
    b.dst = [state.partOf[top].rep_lon, state.partOf[top].rep_lat];
  }
  b.path = curve(b.src, b.dst);
  b.angle = heading(b.path[39], b.path[40]);
}

// ── 생활권 내부: 주변부(1km 격자)·중심지 덩어리 사이 ──────────────────────
// int 표: pc [주변 격자, 덩어리, 값] · cp [덩어리, 주변 격자, 값] · cc [덩어리, 덩어리, 값] · pp [주변 격자, 출발 합, 도착 합]
function internalOf(ds) {
  const I = state.flows[state.rid].int[ds], f = fac(ds), part = state.part, kind = state.kind;
  const kinds = { pc: 0, cp: 0, ccx: 0, ccs: 0, pp: 0 }, byPart = new Map();
  const addPart = (p, v) => byPart.set(p, (byPart.get(p) || 0) + v);
  for (const [, p, v] of I.pc) { kinds.pc += v * f; if (kind === "pc") addPart(p, v * f); }
  for (const [p, , v] of I.cp) { kinds.cp += v * f; if (kind === "cp") addPart(p, v * f); }
  for (const [a, b, v] of I.cc) {
    kinds[a === b ? "ccs" : "ccx"] += v * f;
    if (kind === "cc" && a !== b) { addPart(a, v * f); addPart(b, v * f); }
  }
  for (const [, o] of I.pp) kinds.pp += o * f;
  let items;
  if (kind === "cc") {
    // 덩어리 사이 화살표 (같은 덩어리 안은 표에만). 키는 생활권 idx 와 안 겹치게 (a+1)*1e5+b
    items = I.cc.filter(([a, b]) => a !== b && (part == null || a === part || b === part))
      .map(([a, b, v]) => ({ o: (a + 1) * 100000 + b, a, b, v: v * f }));
  } else if (kind === "pp") {
    items = I.pp.filter(([, o]) => o > 0).map(([g, o]) => ({ o: g, v: o * f }));
  } else {
    // 주변부 격자마다 합 + 가장 많이 오가는 덩어리
    const by = new Map();
    for (const r of I[kind]) {
      const [g, p] = kind === "pc" ? [r[0], r[1]] : [r[1], r[0]], v = r[2] * f;
      if (part != null && p !== part) continue;
      let d = by.get(g);
      if (!d) by.set(g, (d = { o: g, v: 0, parts: new Map() }));
      d.v += v; d.parts.set(p, (d.parts.get(p) || 0) + v);
    }
    items = [...by.values()].map((d) => {
      let top = null, mv = -1;
      for (const [p, v] of d.parts) if (v > mv) { mv = v; top = p; }
      return { o: d.o, v: d.v, top, topShare: mv / d.v };
    });
  }
  items.sort((x, y) => y.v - x.v);
  const total = items.reduce((s, d) => s + d.v, 0);
  for (const d of items) d.share = d.v / total;
  return { kinds, items, total, byPart };
}

function rebuildInner() {
  const C = D.C;
  if (cmp()) {
    const a = internalOf("kt"), k = internalOf("kcb"), m = new Map();
    for (const d of a.items) m.set(d.o, { sa: d.share, sb: 0, A: d });
    for (const d of k.items) { const x = m.get(d.o) ?? { sa: 0 }; x.sb = d.share; x.B = d; m.set(d.o, x); }
    D.items = [...m.values()].map((x) => ({ ...(x.sa >= x.sb ? x.A : x.B), sa: x.sa, sb: x.sb, d: x.sa - x.sb, v: 50 * (x.sa + x.sb), share: (x.sa + x.sb) / 2 }))
      .sort((p, q) => q.v - p.v);
    D.kinds = { kt: a.kinds, kcb: k.kinds }; D.byPart = { kt: a.byPart, kcb: k.byPart }; D.total = 100;
    // 격자 하나의 비중은 아주 작아 %p 차이로는 색이 안 갈림 → 상대 차이 (KT−KCB)/(KT+KCB), ±0.5 에서 최대
    for (const d of D.items) {
      const t = Math.max(-1, Math.min(1, d.d / (d.sa + d.sb || 1) / 0.5));
      d.color = mix(C.other, t > 0 ? C.kt : C.kcb, Math.abs(t));
    }
  } else {
    const r = internalOf(state.ds), dsc = rgb(css(`--${state.ds}`));
    D.items = r.items; D.kinds = { [state.ds]: r.kinds }; D.byPart = { [state.ds]: r.byPart }; D.total = r.total;
    for (const d of D.items) d.color = state.kind === "cc" ? partColor(d.a) : state.kind === "pp" ? dsc : partColor(d.top);
  }
  const cc = state.kind === "cc";
  for (const d of D.items) {
    d.hex = `rgb(${d.color.slice(0, 3).join(",")})`;
    if (!cc) { d.pos = G[d.o]; continue; }
    const pa = state.partOf[d.a], pb = state.partOf[d.b];
    d.src = [pa.rep_lon, pa.rep_lat]; d.dst = [pb.rep_lon, pb.rep_lat];
    d.path = curve(d.src, d.dst); d.angle = heading(d.path[39], d.path[40]);
  }
  D.list = cc ? D.items : []; D.dots = cc ? [] : D.items;
  D.max = D.items.length ? D.items[0].v : 1;
  D.byO = new Map(D.list.map((b) => [b.o, b]));
  applyThreshold();
}

function rebuild() {
  const pal = CAT[isDark() ? "dark" : "light"];
  D.C = { fg: rgb(css("--fg")), panel: rgb(css("--panel")), muted: rgb(css("--muted")), other: rgb(css("--other")),
    kt: rgb(css("--kt")), kcb: rgb(css("--kcb")), land: rgb(css("--land")), sido: rgb(css("--sido")), sgg: rgb(css("--sgg")) };
  D.theme = isDark() ? "dark" : "light";
  if (!state.rid) { D.list = []; D.dots = []; D.byO = new Map(); applyThreshold(); return; }
  if (inner()) return rebuildInner();
  D.dots = [];
  if (cmp()) {
    // 단위가 달라 비중(%)으로 비교. 굵기 = 두 비중 평균, 색 = 비중 차이(±5%p 에서 최대)
    const a = bundle("kt"), k = bundle("kcb"), m = new Map();
    for (const b of a.list) m.set(b.o, { sa: b.share, sb: 0, A: b });
    for (const b of k.list) { const x = m.get(b.o) ?? { sa: 0 }; x.sb = b.share; x.B = b; m.set(b.o, x); }
    D.list = [...m.values()].map((x) => {
      const base = x.sa >= x.sb ? x.A : x.B;
      return { ...base, sa: x.sa, sb: x.sb, d: x.sa - x.sb, from: x.sa >= x.sb ? "KT" : "KCB", v: 50 * (x.sa + x.sb), share: (x.sa + x.sb) / 2 };
    }).sort((p, q) => q.v - p.v);
    D.total = 100; D.totals = { kt: a.total, kcb: k.total };
    for (const b of D.list) {
      const t = Math.max(-1, Math.min(1, b.d / 0.05));
      b.color = mix(D.C.other, t > 0 ? D.C.kt : D.C.kcb, Math.abs(t));
      b.hex = `rgb(${b.color.slice(0, 3).join(",")})`;
    }
  } else {
    ({ list: D.list, total: D.total } = bundle(state.ds));
    // 색은 임계치와 무관하게 전체 순위로 고정 (임계치를 바꿔도 같은 생활권은 같은 색)
    D.list.forEach((b, i) => { b.hex = i < 8 ? pal[i] : css("--other"); b.color = rgb(b.hex); });
  }
  D.list.forEach(place);
  D.max = D.list.length ? D.list[0].v : 1;
  D.byO = new Map(D.list.map((b) => [b.o, b]));
  applyThreshold();
}

function applyThreshold() {
  const t = state.thr[tk()];
  D.shown = D.list.filter((b) => b.v >= t || b.o === state.focusO);
  D.dotsShown = D.dots.filter((d) => d.v >= t);
  // 입자: 경로마다 3개, 한 바퀴(0~1) 돌도록 앞뒤로 복제
  D.trips = [];
  for (const b of D.shown) for (let k = 0; k < 3; k++) for (const s of [0, -1]) {
    const off = k / 3 + s;
    D.trips.push({ b, ts: b.path.map((_, j) => off + j / 40) });
  }
  renderPanel(); renderTable();
}

// ── 그리기 ─────────────────────────────────────────────────
const W = (v) => 1.5 + 15 * Math.sqrt(v / D.max);

function layers() {
  const C = D.C, hov = state.hoverO, foc = state.focusO, rid = state.rid;
  const dim = (b) => (hov != null && b.o !== hov) || (hov == null && foc != null && b.o !== foc);
  const shownO = new Set(D.shown.map((b) => b.o));
  const other = (f) => { const b = D.byO.get(ridIdx[f.properties.rid]); return b && shownO.has(b.o) ? b : null; };
  const trig = [rid, state.ds, state.dir, state.ot, state.kind, state.part, hov, foc, D.shown.length, D.dotsShown.length, D.theme, state.dmode, state.ktu];
  const out = [];
  const tiles = (name) => new deck.TileLayer({ id: `tiles-${name}`, data: `${ESRI}/${name}/MapServer/tile/{z}/{y}/{x}`,
    minZoom: 0, maxZoom: 16, tileSize: 256,
    renderSubLayers: (p) => { const [[w, s], [e, n]] = p.tile.boundingBox;
      return new deck.BitmapLayer(p, { data: null, image: p.data, bounds: [w, s, e, n] }); } });

  if (state.bm === "tile") out.push(tiles(TILES[D.theme]));
  else if (vec) {
    out.push(new deck.GeoJsonLayer({ id: "sido", data: vec.sido, filled: true, stroked: true,
      getFillColor: C.land, getLineColor: C.sido, getLineWidth: 1, lineWidthUnits: "pixels", updateTriggers: { getFillColor: D.theme, getLineColor: D.theme } }));
    out.push(new deck.GeoJsonLayer({ id: "sgg", data: vec.sgg, filled: false, stroked: true,
      getLineColor: C.sgg, getLineWidth: 0.6, lineWidthUnits: "pixels", updateTriggers: { getLineColor: D.theme } }));
  }

  out.push(new deck.GeoJsonLayer({ id: "regions", data: regions, pickable: true, filled: true, stroked: true,
    getFillColor: (f) => { const b = other(f); return f.properties.rid === rid ? A(C.fg, 14) : b ? A(b.color, dim(b) ? 14 : 52) : [0, 0, 0, 0]; },
    getLineColor: (f) => { const b = other(f); return f.properties.rid === rid ? C.fg : b ? A(b.color, dim(b) ? 70 : 220) : A(C.muted, 90); },
    getLineWidth: (f) => f.properties.rid === rid ? 2.5 : other(f) ? 1.4 : 0.6,
    lineWidthUnits: "pixels", autoHighlight: true, highlightColor: A(C.fg, 24),
    updateTriggers: { getFillColor: trig, getLineColor: trig, getLineWidth: trig } }));

  { // 한글 지명 (시도, 확대하면 시군구)
    const lv = state.zoom >= 8.3 ? "sgg" : "sido";
    out.push(new deck.TextLayer({ id: `labels-${lv}`, data: labels.filter((l) => l[3] === lv), characterSet: "auto",
      getText: (l) => l[0], getPosition: (l) => [l[1], l[2]], getSize: 11, getColor: A(C.muted, 200),
      fontFamily: "IBM Plex Sans KR, Malgun Gothic, sans-serif", fontWeight: 500, updateTriggers: { getColor: D.theme } }));
  }

  // 중심지 (화살표 아래): 유입·내부면 이 생활권 덩어리(눌러서 하나만), 유출이면 화살표가 닿는 상대 생활권 덩어리.
  // 내부 모드는 덩어리마다 색 (주변부 점 색과 같음 → 어느 중심지가 어느 주변부와 엮이는지)
  const own = rid ? state.centersBy[rid] : [];
  const cdata = state.dir === "out" ? [...own, ...D.shown.flatMap((b) => state.centersBy[RID[b.o]] || [])] : own;
  out.push(new deck.GeoJsonLayer({ id: "centers", data: cdata, pickable: state.dir !== "out", filled: true, stroked: true,
    getFillColor: (f) => {
      if (state.dir === "out") return A(C.fg, f.properties.rid === rid ? 70 : 170);
      const on = state.part == null || f.properties.part === state.part;
      return inner() && !cmp() ? A(partColor(f.properties.part), on ? 200 : 60) : A(C.fg, on ? 170 : 55);
    },
    getLineColor: (f) => f.properties.part === state.part ? (inner() ? C.fg : rgb(css(`--${state.ds}`))) : A(C.panel, 230),
    getLineWidth: (f) => f.properties.part === state.part ? 2.5 : 1, lineWidthUnits: "pixels",
    autoHighlight: state.dir !== "out", highlightColor: A(C.fg, 220),
    updateTriggers: { getFillColor: trig, getLineColor: trig, getLineWidth: trig } }));

  // 내부: 주변부 1km 격자 점 (크기 = 통근량, 색 = 주로 오가는 덩어리 / 비교면 비중 차이)
  if (D.dotsShown.length) {
    out.push(new deck.ScatterplotLayer({ id: "dots", data: D.dotsShown, pickable: true, getPosition: (d) => d.pos,
      getRadius: (d) => 1.5 + 9 * Math.sqrt(d.v / D.max), radiusUnits: "pixels",
      getFillColor: (d) => A(d.color, 210), stroked: true, getLineColor: A(C.panel, 200), lineWidthUnits: "pixels", getLineWidth: 0.6,
      updateTriggers: { getFillColor: trig, getRadius: trig } }));
  }

  // 격자 상세: 고른 상대 생활권 묶음의 1km 출발 격자 (유입·유출만)
  const fb = foc != null && !inner() ? D.byO.get(foc) : null;
  if (fb) {
    const gmax = Math.max(...fb.gridPts.map((g) => g[2]));
    out.push(new deck.LineLayer({ id: "detail-lines", data: fb.gridPts, getSourcePosition: (g) => [g[0], g[1]],
      getTargetPosition: () => fb.dst, getColor: A(fb.color, 40), getWidth: 1, updateTriggers: { getColor: trig, getTargetPosition: trig } }));
    out.push(new deck.ScatterplotLayer({ id: "detail-dots", data: fb.gridPts, pickable: true,
      getPosition: (g) => [g[0], g[1]], getRadius: (g) => 2 + 9 * Math.sqrt(g[2] / gmax), radiusUnits: "pixels",
      getFillColor: A(fb.color, 200), stroked: true, getLineColor: A(C.panel, 220), lineWidthUnits: "pixels", getLineWidth: 0.8,
      updateTriggers: { getFillColor: trig, getRadius: trig } }));
  }

  const shown = D.shown.slice().reverse(); // 큰 흐름이 위
  out.push(new deck.PathLayer({ id: "arrows", data: shown, pickable: true, getPath: (b) => b.path,
    getColor: (b) => A(b.color, dim(b) ? 25 : state.anim ? 95 : 175), getWidth: (b) => W(b.v),
    widthUnits: "pixels", capRounded: true, jointRounded: true,
    onHover: (i) => setHover(i.object ? i.object.o : null, true),
    updateTriggers: { getColor: [...trig, state.anim], getWidth: trig } }));
  if (state.anim) {
    out.push(new deck.TripsLayer({ id: "particles", data: D.trips, getPath: (d) => d.b.path, getTimestamps: (d) => d.ts,
      getColor: (d) => A(d.b.color, dim(d.b) ? 40 : 255), getWidth: (d) => W(d.b.v) * 0.75 + 1, widthUnits: "pixels",
      capRounded: true, jointRounded: true, trailLength: 0.22, fadeTrail: true, currentTime: state.t,
      updateTriggers: { getColor: trig, getWidth: trig } }));
  }
  out.push(new deck.IconLayer({ id: "heads", data: shown, pickable: true, iconAtlas: ARROW,
    iconMapping: { a: { x: 0, y: 0, width: 64, height: 64, anchorX: 64, anchorY: 32, mask: true } },
    getIcon: () => "a", getPosition: (b) => b.path[40], getAngle: (b) => b.angle,
    getSize: (b) => W(b.v) * 1.6 + 9, sizeUnits: "pixels", getColor: (b) => A(b.color, dim(b) ? 40 : 240),
    updateTriggers: { getColor: trig, getSize: trig } }));

  // 도착점 표시 (화살 끝이 모이는 덩어리 대표점 또는 생활권 중심)
  const dests = [...new Map(D.shown.map((b) => [b.dst.join(), b.dst])).values()];
  out.push(new deck.ScatterplotLayer({ id: "dest-pt", data: dests, getPosition: (p) => p, getRadius: 4.5, radiusUnits: "pixels",
    getFillColor: C.fg, stroked: true, getLineColor: C.panel, getLineWidth: 2, lineWidthUnits: "pixels",
    updateTriggers: { getFillColor: D.theme, getLineColor: D.theme } }));

  if (inner()) {
    // 덩어리 번호 (색 있는 큰 8곳 + 고른 곳)
    out.push(new deck.TextLayer({ id: "part-no", data: own.filter((f) => f.properties.no <= 8 || f.properties.part === state.part),
      characterSet: "auto", getText: (f) => `${f.properties.no}`, getPosition: (f) => [f.properties.rep_lon, f.properties.rep_lat],
      getSize: 12, getColor: C.fg, fontWeight: 700, fontFamily: "IBM Plex Mono, Consolas, monospace",
      background: true, backgroundPadding: [5, 2], getBackgroundColor: A(C.panel, 235),
      getBorderColor: (f) => (cmp() ? C.fg : partColor(f.properties.part)), getBorderWidth: 1.5,
      updateTriggers: { getBackgroundColor: D.theme, getColor: D.theme, getBorderColor: trig } }));
    return out;
  }
  // 상대 생활권 이름 (상위 5곳 + 고른 곳·가리킨 곳). 유출이면 도착 쪽에 붙임
  const named = D.shown.filter((b) => D.list.indexOf(b) < 5 || b.o === foc || b.o === hov);
  out.push(new deck.TextLayer({ id: "names", data: named, characterSet: "auto", getText: (b) => rname[b.o],
    getPosition: (b) => state.dir === "in" ? b.src : b.dst, getSize: 12, getColor: C.fg, getPixelOffset: [0, -14], fontWeight: 600,
    fontFamily: "IBM Plex Sans KR, Malgun Gothic, sans-serif", background: true, backgroundPadding: [4, 2],
    getBackgroundColor: A(C.panel, 225), getBorderColor: (b) => b.color, getBorderWidth: 1,
    updateTriggers: { getBackgroundColor: D.theme, getColor: D.theme, getBorderColor: trig, getPosition: trig } }));
  return out;
}

function draw() { if (deckgl) deckgl.setProps({ layers: layers() }); }

function setHover(o, fromMap) {
  if (o === state.hoverO) return;
  state.hoverO = o;
  document.querySelectorAll("#tbody tr[data-o]").forEach((tr) => tr.classList.toggle("hot", +tr.dataset.o === o));
  if (fromMap && o != null) document.querySelector(`#tbody tr[data-o="${o}"]`)?.scrollIntoView({ block: "nearest" });
  if (!state.anim) draw();
}

function toggleFocus(o) {
  state.focusO = state.focusO === o ? null : o;
  applyThreshold(); draw();
}

function togglePart(p) {
  state.part = state.part === p ? null : p;
  state.focusO = null; state.hoverO = null;
  rebuild(); draw();
}

function fitTo(rid) {
  let [x0, y0, x1, y1] = [180, 90, -180, -90];
  const walk = (c) => typeof c[0] === "number"
    ? (x0 = Math.min(x0, c[0]), y0 = Math.min(y0, c[1]), x1 = Math.max(x1, c[0]), y1 = Math.max(y1, c[1]))
    : c.forEach(walk);
  walk(regionBy[rid].geometry.coordinates);
  // 90%를 채우는 상위 상대 생활권까지 (먼 곳의 작은 흐름 때문에 전국으로 줌아웃되지 않게)
  let cum = 0;
  for (const b of inner() ? [] : D.list.slice(0, 6)) {
    if (cum >= 0.9) break;
    walk(regionBy[RID[b.o]].geometry.coordinates);
    cum += b.share;
  }
  const width = $("map").clientWidth, height = $("map").clientHeight;
  const vp = new deck.WebMercatorViewport({ width, height }).fitBounds([[x0, y0], [x1, y1]], { padding: Math.min(width, height) * 0.06 });
  deckgl.setProps({ initialViewState: { longitude: vp.longitude, latitude: vp.latitude, zoom: Math.min(vp.zoom, 9.5), transitionDuration: 600 } });
}

// ── 패널 ───────────────────────────────────────────────────
function renderPanel() {
  $("empty").hidden = !!state.rid;
  if (!state.rid) return;
  $("sel").hidden = false;
  $("sel-name").textContent = rname[ridIdx[state.rid]];
  const dotMode = inner() && state.kind !== "cc";
  if (inner()) {
    const K = D.kinds, sel = (k) => (state.kind === "cc" ? k.ccx : k[state.kind]);
    if (cmp()) {
      $("st-a").textContent = fmt(sum(K.kt)); $("st-a-l").textContent = `KT 내부 합 (${KTU[state.ktu].unit})`;
      $("st-b").textContent = fmt(sum(K.kcb)); $("st-b-l").textContent = "KCB 내부 합 (명)";
    } else {
      const k = K[state.ds];
      $("st-a").textContent = fmt(sum(k)); $("st-a-l").textContent = `내부 합 (${unit()})`;
      $("st-b").textContent = pct(sel(k) / sum(k)); $("st-b-l").textContent = "고른 흐름 비중";
    }
  } else if (cmp()) {
    $("st-a").textContent = fmt(D.totals.kt * fac("kt")); $("st-a-l").textContent = `KT 합 (${KTU[state.ktu].unit})`;
    $("st-b").textContent = fmt(D.totals.kcb); $("st-b-l").textContent = "KCB 합 (명)";
  } else {
    const shownV = D.shown.reduce((a, b) => a + b.v, 0);
    $("st-a").textContent = fmt(D.total); $("st-a-l").textContent = `${state.dir === "in" ? "유입" : "유출"} 합 (${unit()})`;
    $("st-b").textContent = D.total ? pct(shownV / D.total) : "–"; $("st-b-l").textContent = "화살표 비중";
  }
  $("st-c").textContent = dotMode ? `${D.dotsShown.length}/${D.dots.length}` : `${D.shown.length}/${D.list.length}`;
  $("st-c-l").textContent = dotMode ? "격자 점" : "화살표";
  const fb = state.focusO != null ? D.byO.get(state.focusO) : null;
  $("chip").hidden = !fb;
  if (fb) $("chip-text").textContent = inner() ? `중심지 ${partNo(fb.a)} → ${partNo(fb.b)} 강조`
    : `${rname[fb.o]} · 출발 격자 ${fb.gridPts.length.toLocaleString()}개${cmp() ? ` (${fb.from})` : ""}`;
  const pp = state.part != null ? state.partOf[state.part] : null;
  $("chip-part").hidden = !pp;
  if (pp) $("chip-part-t").textContent = `중심지 덩어리 하나만 · 격자 ${pp.n_grid}개`;
}

const sum = (o) => [...(o instanceof Map ? o.values() : Object.values(o))].reduce((a, b) => a + b, 0);
const signed = (x) => `${x >= 0 ? "+" : "−"}${Math.abs(100 * x).toFixed(1)}`;

// 내부 표: 흐름 종류 5줄(누르면 그 흐름으로) + 고른 흐름의 덩어리별 분해(누르면 그 덩어리만)
function renderTableInner() {
  const c = cmp(), K = D.kinds, ds = state.ds, cur = state.kind === "cc" ? "ccx" : state.kind;
  $("tbl-title").textContent = ro(rname[ridIdx[state.rid]]);
  const cols = c ? `<th class="num">KT</th><th class="num">KCB</th><th class="num">차이</th>` : `<th class="num">${unit()}</th><th class="num">비중</th>`;
  $("thead").innerHTML = `<tr><th></th><th>흐름</th>${cols}</tr>`;
  const cells = (a, b) => c ? `<td class="num">${pct(a)}</td><td class="num">${pct(b)}</td><td class="num">${signed(a - b)}</td>`
    : `<td class="num">${fmt(a)}</td><td class="num">${pct(b)}</td>`;
  const rows = Object.entries(KINDS).map(([k, label]) => {
    const v = c ? [K.kt[k] / sum(K.kt), K.kcb[k] / sum(K.kcb)] : [K[ds][k], K[ds][k] / sum(K[ds])];
    return `<tr tabindex="0" data-kind="${k.startsWith("cc") ? "cc" : k}" class="${k === cur ? "focus" : ""}"><td></td><td>${label}</td>${cells(...v)}</tr>`;
  });
  if (state.kind !== "pp") {
    const head = { pc: "주변부에서 받음", cp: "주변부로 보냄", cc: "다른 덩어리와 주고받음" }[state.kind];
    rows.push(`<tr class="sep"><td colspan="${c ? 5 : 4}">중심지 덩어리별 · ${head}</td></tr>`);
    const P = c ? D.byPart : { [ds]: D.byPart[ds] }, tot = Object.fromEntries(Object.entries(P).map(([k, m]) => [k, sum(m)]));
    for (const f of [...state.centersBy[state.rid]].sort((x, y) => x.properties.no - y.properties.no)) {
      const p = f.properties.part, has = Object.values(P).some((m) => m.get(p));
      if (!has) continue;
      const v = c ? [(P.kt.get(p) || 0) / tot.kt, (P.kcb.get(p) || 0) / tot.kcb] : [P[ds].get(p), P[ds].get(p) / tot[ds]];
      const sw = c ? "" : `<span class="sw" style="background:rgb(${partColor(p).slice(0, 3).join(",")})"></span>`;
      rows.push(`<tr tabindex="0" data-part="${p}" class="${p === state.part ? "focus" : ""}"><td>${sw}</td><td>중심지 ${f.properties.no} <small style="color:var(--muted)">격자 ${f.properties.n_grid}</small></td>${cells(...v)}</tr>`);
    }
  }
  $("tbody").innerHTML = rows.join("");
  $("tfoot").innerHTML = `<tr><td></td><td>내부 합계</td>${c ? `<td class="num">100%</td><td class="num">100%</td><td class="num">%p</td>` : `<td class="num">${fmt(sum(K[ds]))}</td><td class="num">100%</td>`}</tr>`;
}

function renderTable() {
  if (state.rid && inner()) return renderTableInner();
  const t = state.thr[tk()], c = cmp(), n = c ? 5 : 4;
  $("tbl-title").textContent = state.rid ? ro(rname[ridIdx[state.rid]]) : "상대 생활권";
  $("thead").innerHTML = `<tr><th></th><th>${state.dir === "in" ? "출발" : "도착"} 생활권</th>${c
    ? `<th class="num">KT</th><th class="num">KCB</th><th class="num">차이</th>` : `<th class="num">${unit()}</th><th class="num">비중</th>`}</tr>`;
  let sep = false;
  $("tbody").innerHTML = D.list.map((b) => {
    const below = b.v < t;
    const head = below && !sep ? ((sep = true), `<tr class="sep"><td colspan="${n}">임계치 미만</td></tr>`) : "";
    const cls = [below && b.o !== state.focusO ? "below" : "", b.o === state.focusO ? "focus" : "", b.o === state.hoverO ? "hot" : ""].join(" ");
    const cells = c
      ? `<td class="num">${pct(b.sa)}</td><td class="num">${pct(b.sb)}</td><td class="num">${b.d >= 0 ? "+" : "−"}${Math.abs(100 * b.d).toFixed(1)}</td>`
      : `<td class="num">${fmt(b.v)}</td><td class="num share">${pct(b.share)}<i style="width:${Math.max(2, 40 * b.v / D.max).toFixed(0)}px"></i></td>`;
    return `${head}<tr data-o="${b.o}" tabindex="0" class="${cls}"><td><span class="sw" style="background:${b.hex}"></span></td><td>${rname[b.o]}</td>${cells}</tr>`;
  }).join("");
  $("tfoot").innerHTML = state.rid
    ? `<tr><td></td><td>합계</td>${c ? `<td class="num">100%</td><td class="num">100%</td><td class="num">%p</td>` : `<td class="num">${fmt(D.total)}</td><td class="num">100%</td>`}</tr>` : "";
}

function getTooltip({ layer, object }) {
  if (!object) return null;
  const u = unit(), me = rname[ridIdx[state.rid]];
  if (layer.id === "dots") {
    const side = { pc: "주변부 출발 격자 → 중심지", cp: "중심지 → 주변부 도착 격자", pp: "주변부 격자 → 다른 주변부" }[state.kind];
    const val = cmp() ? `KT ${pct(object.sa)} · KCB ${pct(object.sb)}` : `${fmt(object.v)} ${u}`;
    const top = object.top != null && !cmp() ? `<br>주로 중심지 ${partNo(object.top)}${state.kind === "pc" ? "로" : "에서"} (${pct(object.topShare)})` : "";
    return { className: "tip", html: `${side}<br>${val}${top}` };
  }
  if (inner() && (layer.id === "arrows" || layer.id === "heads")) {
    const val = cmp() ? `KT ${pct(object.sa)} · KCB ${pct(object.sb)} (${signed(object.d)}%p)` : `${fmt(object.v)} ${u} · ${pct(object.share)}`;
    return { className: "tip", html: `중심지 ${partNo(object.a)} → 중심지 ${partNo(object.b)}<br>${val}` };
  }
  if (inner() && layer.id === "centers") return { className: "tip", html: `중심지 ${object.properties.no} · 격자 ${object.properties.n_grid}개<br><small>누르면 이 덩어리만</small>` };
  if (layer.id === "arrows" || layer.id === "heads") {
    const path = state.dir === "in" ? `<b>${rname[object.o]}</b> → ${me}` : `${me} → <b>${rname[object.o]}</b>`;
    const val = cmp() ? `KT ${pct(object.sa)} · KCB ${pct(object.sb)} (${object.d >= 0 ? "+" : "−"}${Math.abs(100 * object.d).toFixed(1)}%p)`
      : `${fmt(object.v)} ${u} · ${pct(object.share)}`;
    return { className: "tip", html: `${path}<br>${val}` };
  }
  if (layer.id === "detail-dots") return { className: "tip", html: `1km 격자 · ${fmt(object[2])}${cmp() ? "" : ` ${u}`}` };
  if (layer.id === "centers") return { className: "tip", html: `중심지 덩어리 · 격자 ${object.properties.n_grid}개<br><small>누르면 이 덩어리로 오는 흐름만</small>` };
  if (layer.id === "regions") {
    const b = D.byO.get(ridIdx[object.properties.rid]);
    return { className: "tip", html: `<b>${object.properties.rname}</b>${b ? `<br>${cmp() ? `KT ${pct(b.sa)} · KCB ${pct(b.sb)}` : `${fmt(b.v)} ${u}`}` : ""}` };
  }
  return null;
}

init().catch((e) => { $("empty").hidden = false; $("empty").textContent = e.message; });
</script>
